[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eirm"
version = "0.1.0"
description = "Physically ordered simulator for rotating-prism AMI event cameras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "opencv-python>=4.5",
  "h5py>=3.7",
  "imageio>=2.25",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.scripts]
eirm = "ami_sim.cli:main"
eirm-sim = "ami_sim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ami_sim*"]
